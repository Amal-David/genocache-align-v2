[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genocache-production"
version = "0.1.0"
description = "Reproducible genomic mapping jobs and independently evaluated embedding retrieval"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "pysam==0.24.1"]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.10,<2"]
torch = ["torch>=2.5,<3"]
cloud = ["boto3==1.43.108", "modal==1.6.1"]
test = ["pytest==9.1.1", "ruff>=0.11"]

[project.scripts]
genocache = "genocache.cli:main"
genocache-retrieval = "genocache.retrieval:main"
genocache-model = "genocache.model_cli:main"
genocache-cloud = "genocache.cloud:main"
genocache-evaluate = "genocache.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genocache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises real minimap2 and BAM tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
